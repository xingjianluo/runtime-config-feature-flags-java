# 运维投放的运行时配置（优先级高于 application.properties，低于运行时覆盖）
service.thread-pool.size=16
service.greeting=hello-from-runtime-config
server.port=0

# 初始功能开关：与配置项同属一套版本，随快照一起装载、提交与回滚
flag.new-checkout.enabled=true
flag.new-checkout.percentage=25
flag.beta-search.enabled=true
flag.beta-search.percentage=0
flag.legacy-report.enabled=false
flag.legacy-report.percentage=100
